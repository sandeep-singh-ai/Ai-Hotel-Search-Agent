[project]
name = "hotel_research"
version = "0.1.0"
description = "hotel_research using crewAI"
authors = [{ name = "Sandeep", email = "sandeep@onlinecloud.dev" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]>=1.15.23,<2.0.0",
    "serpapi>=1.1.2",
]

[project.scripts]
hotel_research = "hotel_research.main:run"
run_crew = "hotel_research.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
project_id = "a6ec92d0-bf95-49b0-a61c-6b192ab0bd80"
