travel_agent_task:
  description: >
    Conduct a thorough research about {location} hotel in the {location} within the given {miles} miles radius.
    Make sure you find any interesting and relevant information about the hotel.
  expected_output: >
    A list with 2 bullet points of the most relevant information about the hotel.
  agent: travel_agent

tourist_guide_task:
  description: >
    Review the context you got and guide the user to the best hotel in {location} within the given {miles} miles radius.
    Make sure the guide is detailed and contains any and all relevant information.
  expected_output: >
    A fully 2 bullet points guide with the best hotel in {location} within the given {miles} miles radius.
    Formatted as markdown without '```'
  agent: tourist_guide
