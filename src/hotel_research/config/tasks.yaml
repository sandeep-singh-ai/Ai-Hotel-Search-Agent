travel_agent_task:
  description: >
    Search for hotels in {location} for check-in {check_in_date} and check-out {check_out_date}.
    Call hotel_search_tool with location="{location}", check_in_date="{check_in_date}",
    check_out_date="{check_out_date}" and miles={miles}.
    Rank the returned hotels for these traveler preferences: {preferences}.
    Use only data the tool returned. If the tool returns an error, a note, or no hotels, report that.
  expected_output: >
    A ranked list of up to 8 hotels. For each: name, price per night, total price,
    Google rating, review count, hotel class, distance in miles, key amenities, link,
    and one line on why it fits or does not fit the preferences.
    Include the dates searched and any note or error from the tool.
  agent: travel_agent

tourist_guide_task:
  description: >
    Using only the travel agent's ranked list, recommend the best hotel in {location}
    within {miles} miles for a stay from {check_in_date} to {check_out_date},
    given these preferences: {preferences}. Also name two runner-up alternatives
    and explain the trade-offs. Do not add hotels that are not in the list.
    If the research reported an error or no results, say so instead of recommending.
  expected_output: >
    A markdown guide (without '```') with: the stay dates and radius, the top pick with
    price, rating, reviews, distance, amenities and link, why it is the best fit,
    and two runner-ups with their trade-offs.
  agent: tourist_guide
